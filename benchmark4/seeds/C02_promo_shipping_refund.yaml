competing_rules:
- 全部商品剩余实付额判断门槛
- 仅商家结算商品剩余标价判断门槛
- 原订单永久保留免邮补贴
public_policy:
  document_id: promo_shipping_policy.md#default
  default_rule: 没有活动专门约定时，免邮活动的退货后资格按全部保留商品实付额判断；低于活动门槛且承运补贴仍需商家承担时，追回原补贴金额。
  contract_time: 有明确冻结合同快照的旧订单使用下单时的补贴承担状态；无冻结快照的新订单使用当前客观状态。
  fallback: 承运合同不再向商家追收该笔补贴时，不向用户追加补贴追回款。非免邮订单不产生此项；不涉及商品退款本金。
  unknown_data: 必填金额或合同状态缺失应报输入错误，不猜测0；所有金额使用整数分。
data_schema:
  orders: 本次待核算订单数组；只核算返还/补收的运费补贴，输入已给出保留商品金额。
  order_id: 唯一订单标识。
  promo_waived: 下单是否享受活动免邮。
  shipping_subsidy_cents: 原活动代付的运费补贴。
  retained_lines: 保留商品列表。
  line_id: 商品行标识。
  settlement_owner: 实际结算方，STORE为商家、BRAND为品牌方；不声明活动计入范围。
  retained_list_cents: 保留数量对应的原标价，不减优惠。
  retained_paid_cents: 保留数量对应的实付金额。
  checkout_recovery: 冻结的下单承运合同是否仍需向商家追收补贴；null表示使用当前状态。
  promo_threshold_cents: 当前活动金额门槛。
  carrier_recovery_required: 当前承运合同的客观补贴追收状态，不描述团队活动资格规矩。
fallback:
  rule: 无补贴追收责任则新订单不补收；旧订单按冻结合同责任核算；其他仍按公开常规政策回退。
  source: public_document
  reference: promo_shipping_policy.md#default
gold:
  rule: 已享免邮的订单按保留商品重新核算补贴资格；只计STORE结算行的剩余原标价，不计BRAND结算行或实付折扣口径。低于10000分且有该订单的补贴追收责任时追回800分。
  key_premise: 这是商家承担的促销预算，只补贴STORE结算商品；资格基于活动账本原标价而非支付净额。追回金额成立还依赖该订单的承运合同追收责任。
  scope_boundary: 等于门槛不追回；非免邮订单为0；不改商品本金退款。旧订单使用冻结下单合同，新订单用当前合同状态；当前追收责任解除仅影响未冻结的新订单。
  dead_end: 否决全部商品实付额统一判断；否决无论剩余资格均永久免邮；否决在合同责任消失后仍对新订单机械追回。
facts:
- id: amount_basis
  role: pm_lead
  unlock_act: 1
  text: 本活动的门槛走原标价账本，不跟支付优惠后的净额走；全部商品实付额统一判断的提议不采用。
- id: scope_source
  role: dev_backend
  unlock_act: 2
  text: 商家活动预算只覆盖STORE结算的商品行；BRAND结算行另有预算，不能拿来凑商家这笔门槛。
- id: money_boundary
  role: dev_frontend
  unlock_act: 2
  text: 前端提供的是保留数量对应的金额，按整数分求和，不重复乘原购买数量；等于门槛仍保留免邮资格。
- id: carrier_premise
  role: qa_engineer
  unlock_act: 3
  text: 补收成立的条件是这笔承运补贴确实仍由商家承担；责任解除后不能继续对新订单补收。
- id: old_boundary
  role: dev_backend
  unlock_act: 4
  text: 旧单冻结的下单合同责任仍有效，不能被当前新合同覆盖；新单无冻结快照才看当前责任状态。
- id: final_denial
  role: pm_lead
  unlock_act: 4
  text: 按前面两种口径和合同约定接入；原订单永远免邮的候选否决，非活动订单也不能收这笔钱。
