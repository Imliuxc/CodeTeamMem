facts:
- id: merchant_grain
  role: pm_lead
  unlock_act: 1
  text: 商家按执行记录核对渠道处理结果，不采用售后单行替代逐执行展示的提案。
- id: grouping
  role: dev_frontend
  unlock_act: 1
  text: 售后申请仍是分组层级，执行行需要独立身份供定位和查询。
- id: receipt_premise
  role: dev_backend
  unlock_act: 2
  text: 当前历史阶段的receipt_v1仅在受理后分配receipt_ref，因此非空回执可作为本协议下的受理证据；协议变化时这个推断不保证成立。
- id: proof_boundary
  role: qa_engineer
  unlock_act: 2
  text: 受理确认与执行结果分开；明确ack或查询可证明受理，传输成功或未知不能代替。受理后失败仍需保留。
- id: identity
  role: dev_frontend
  unlock_act: 3
  text: 执行更新保持同一行；重新发起的执行被受理后另增一行，归在原售后分组。
- id: decision
  role: pm_lead
  unlock_act: 3
  text: 按前面已对齐的逐执行方案推进；全部本地尝试都进列表的候选也否决，证据边界依接口约定。
