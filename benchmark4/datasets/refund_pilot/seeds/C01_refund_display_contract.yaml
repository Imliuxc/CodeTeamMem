id: C01_refund_display_contract
status: STAGE1_SCREEN_AUTHORIZED
design_notes:
  confirmed: 逐执行展示、按售后分组；商家逐笔对账；只纳入明确确认受理的执行，受理后失败仍保留。
  proposed: 商家端列表、新增功能任务、E2+C回执语义变化、接口字段和样例均为本轮拟议，须用户审批。
  screen_scope: Stage 1 仅公开政策和数据结构下的 QA 初筛，不证明真实代码不可解。
  anchor_scope: B1 为缺失关键前提的历史压缩共识，B2 为完整结构化 gold 的特权上界；不是 Stage 3 实际原文效果。
  uncertainty: B1 可能根据当前协议自行纠正，C负迁移门槛尚未经模型验证，不保证达标。
  boundary: 同一执行更新原行；未确认受理暂不纳入，不判定为拒绝；不测试资金是否真正变动。
