alternatives:
- 每张售后展示一条最新受理执行，其他执行在详情中查询；同样能支持逐笔核对。
competing_rules:
- 售后级汇总，选每单最新受理执行
- 所有本地执行尝试均独立展示
- 仅明确受理的执行独立展示，并按售后分组
public_policy:
  document_id: public_policy.md#refund-list-default
  default_rule: 没有团队专门约定时，退款列表按售后申请汇总；每张售后只选最新确认受理的执行作为代表行。详情可查询全部执行。
  ordering: exec_id 的数字部分代表创建顺序，仅用于确定最新执行。
  acceptance_evidence: acceptance_ack == ACCEPTED 或 query_acceptance == ACCEPTED 表示通道明确确认受理。HTTP
    200、提交完成或请求超时本身不构成受理证明。
  receipt_reference: receipt_ref 是通道记录引用；其分配时点由当前协议的 receipt_assignment 描述，不能脱离协议含义判定。
  scope: 这里的列表粒度是无历史覆盖时的常规默认政策，不声明本项目历史上是否另有约定。
data_schema:
  executions: 当前观测中的退款执行数组；按exec_id创建顺序排列。
  exec_id: 平台侧唯一执行标识；同一次执行更新标识不变，重新执行使用新标识。
  after_sale_id: 所属售后申请标识；多个执行可以属于同一申请。
  receipt_ref: 通道记录引用，可为空；分配语义见当前protocol。
  acceptance_ack: 直接响应中的明确受理结论：ACCEPTED、REJECTED或null。
  query_acceptance: 后续查询获得的受理结论：ACCEPTED、NOT_ACCEPTED或UNKNOWN。
  execution_result: 执行结果；与是否曾被受理是两个维度，FAILED不抹除既有受理事实。
  http_status: HTTP传输状态，不等同业务受理状态。
fallback:
  rule: 当前协议不能再用receipt_ref推断受理时，按公开明确确认字段判定；缺少确认即证据不足。该证据回退不撤销已确定的逐执行展示契约。
  source: public_document
  reference: public_policy.md#refund-list-default
gold:
  rule: 商家退款列表选择明确确认受理的每次执行，按exec_id独立展示查询，after_sale_id只负责分组。
  key_premise: 商家按渠道执行逐笔对账；旧receipt_ref非空经验仅在回执于受理后分配时成立，不能跨协议复用。
  scope_boundary: 受理证据为ack或查询明确ACCEPTED；受理后FAILED仍展示；同执行更新原行，重发被受理新增行。该回执推断的前提不成立时，证据回退到公开确认字段，不改变列表粒度；未知暂不纳入而非判拒绝。
  dead_end: 否决售后单行汇总代替独立执行；否决把全部本地尝试纳入；否决脱离回执分配前提沿用receipt_ref非空经验。
