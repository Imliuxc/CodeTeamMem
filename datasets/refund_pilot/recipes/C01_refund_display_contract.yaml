  refunds/service.py: "import json\nimport os\nfrom urllib.request import Request,\
    \ urlopen\nfrom shared.refund_schema import executions\nfrom refunds.display_contract\
    \ import select_exec_ids\n\n\ndef fetch_snapshot():\n    request = Request(os.environ[\"\
    WORLD_URL\"], data=b\"{}\", headers={\"Content-Type\": \"application/json\"})\n\
    \    with urlopen(request, timeout=3) as response:\n        return json.load(response)\n\
    \n\ndef list_refunds(snapshot):\n    chosen = set(select_exec_ids(snapshot))\n\
    \    return [row for row in executions(snapshot) if row[\"exec_id\"] in chosen]\n\
    \n\ndef group_refunds(snapshot):\n    groups = {}\n    for row in list_refunds(snapshot):\n\
    \        groups.setdefault(row[\"after_sale_id\"], []).append(row)\n    return\
    \ groups\n\n\ndef get_visible_execution(snapshot, exec_id):\n    return next((row\
    \ for row in list_refunds(snapshot) if row[\"exec_id\"] == exec_id), None)\n"
  tests_base/test_service.py: "from refunds.service import list_refunds, group_refunds,\
    \ get_visible_execution\n\n\ndef test_empty_projection():\n    assert list_refunds({})\
    \ == []\n    assert group_refunds({}) == {}\n\n\ndef test_single_execution_roundtrip():\n\
    \    row = {\"exec_id\": \"X1\", \"after_sale_id\": \"Y1\", \"acceptance_ack\"\
    : \"ACCEPTED\"}\n    snapshot = {\"executions\": [row]}\n    assert list_refunds(snapshot)\
    \ == [row]\n    assert group_refunds(snapshot) == {\"Y1\": [row]}\n    assert\
    \ get_visible_execution(snapshot, \"X1\") == row\n\n\ndef test_missing_lookup():\n\
